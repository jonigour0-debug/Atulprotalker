 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtulProTalker AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d1b;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px;display:flex;
 justify-content:space-between;
 align-items:center;
 background:#11182b;
}
.logo{font-size:21px;font-weight:bold;color:#65d9ff}
button{
 border:0;border-radius:10px;padding:12px;
 background:#397cff;color:white;
 cursor:pointer;font-weight:bold;
}
.layout{display:flex;min-height:90vh}
aside{
 width:220px;background:#10182a;
 padding:15px;
}
aside button{width:100%;margin:7px 0}
main{flex:1;padding:20px;min-width:0}
.panel{
 background:#151f35;padding:20px;
 border-radius:16px;margin-bottom:15px;
}
.ai{
 width:125px;height:125px;border-radius:50%;
 margin:15px auto;
 background:radial-gradient(circle,#6be9ff,#3549dc,#11182b);
 box-shadow:0 0 40px #397cff;
 animation:glow 2s infinite alternate;
}
@keyframes glow{
 to{box-shadow:0 0 65px #8c4fff}
}
#chat{
 height:45vh;overflow-y:auto;
 background:#0d1425;border-radius:12px;
 padding:12px;margin-bottom:12px;
}
.msg{
 padding:12px;margin:8px 0;
 border-radius:12px;background:#202c46;
 overflow-wrap:anywhere;
}
.user{background:#294d85;text-align:right}
input{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #354b70;background:#10182a;
 color:white;margin:7px 0;
}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.hidden{display:none}
h2{color:#6be9ff}
@media(max-width:600px){
 aside{width:115px;padding:8px}
 aside button{font-size:11px;padding:10px 3px}
 main{padding:10px}
}
</style>
</head>

<body>

<header>
 <div class="logo">✦ AtulProTalker AI</div>
 <button onclick="logout()">Logout</button>
</header>

<section id="login" class="panel"
 style="max-width:420px;margin:50px auto;text-align:center">
 <div class="ai"></div>
 <h2>Welcome to AtulProTalker</h2>
 <p>Your personal AI assistant</p>
 <input id="username" placeholder="Enter your username">
 <button onclick="guestLogin()">Continue as Guest</button>
 <p>Guest mode saves history on this device.</p>
</section>

<div id="app" class="layout hidden">

<aside>
 <h3>Menu</h3>
 <button onclick="newChat()">+ New Chat</button>
 <button onclick="showHistory()">History</button>
 <button onclick="showSettings()">Settings</button>
 <button onclick="showHome()">AI Assistant</button>
 <hr>
 <div id="history"></div>
</aside>

<main>
 <section id="home">
  <div class="panel" style="text-align:center">
   <div class="ai"></div>
   <h2>How can I help you?</h2>
   <p>Your intelligent AI companion</p>
  </div>

  <div id="chat"></div>

  <div class="row">
   <input id="message" placeholder="Ask anything..."
    onkeydown="if(event.key==='Enter')sendMessage()">
   <button onclick="sendMessage()">Send</button>
  </div>
 </section>

 <section id="settings" class="panel hidden">
  <h2>Settings</h2>
  <p>Account: <span id="account"></span></p>
  <button onclick="toggleTheme()">Toggle Theme</button>
  <button onclick="clearHistory()">Clear History</button>
  <button onclick="logout()">Logout</button>
 </section>

 <section id="historyPage" class="panel hidden">
  <h2>Chat History</h2>
  <div id="allHistory"></div>
 </section>
</main>
</div>

<script>
const API_URL = "YOUR_CLOUDFLARE_WORKER_URL";

let user = localStorage.getItem("atul_user");
let chats = JSON.parse(localStorage.getItem("atul_chats") || "[]");
let currentChat = [];

function save(){
 localStorage.setItem("atul_chats",JSON.stringify(chats));
}

function guestLogin(){
 let name=document.getElementById("username").value.trim();
 if(!name) name="Guest";
 user=name;
 localStorage.setItem("atul_user",user);
 startApp();
}

function startApp(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("account").textContent=user;
 renderHistory();
 newChat();
}

function logout(){
 localStorage.removeItem("atul_user");
 location.reload();
}

function newChat(){
 currentChat=[];
 document.getElementById("chat").innerHTML="";
 showHome();
 renderHistory();
}

function showHome(){
 hidePages();
 document.getElementById("home").classList.remove("hidden");
}

function showSettings(){
 hidePages();
 document.getElementById("settings").classList.remove("hidden");
}

function showHistory(){
 hidePages();
 document.getElementById("historyPage").classList.remove("hidden");
 renderHistory();
}

function hidePages(){
 ["home","settings","historyPage"].forEach(id=>
 document.getElementById(id).classList.add("hidden"));
}

function addMessage(text,type){
 let box=document.createElement("div");
 box.className="msg "+type;
 box.textContent=text;
 document.getElementById("chat").appendChild(box);
 document.getElementById("chat").scrollTop=999999;
}

async function sendMessage(){
 let input=document.getElementById("message");
 let text=input.value.trim();
 if(!text)return;

 input.value="";
 addMessage(text,"user");
 currentChat.push({role:"user",text});

 let loading=document.createElement("div");
 loading.className="msg";
 loading.textContent="AtulProTalker is thinking...";
 document.getElementById("chat").appendChild(loading);

 try{
  if(API_URL==="YOUR_CLOUDFLARE_WORKER_URL")
   throw new Error("Connect your Cloudflare Worker URL first.");

  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });

  if(!response.ok)throw new Error("Server error: "+response.status);

  const data=await response.json();
  const answer=data.reply || data.answer || data.response;

  if(!answer)throw new Error("Unexpected server response.");

  loading.textContent=answer;
  currentChat.push({role:"assistant",text:answer});
  chats.unshift({
   title:text.slice(0,35),
   messages:currentChat.slice()
  });
  save();
  renderHistory();

 }catch(error){
  loading.textContent="Connection issue: "+error.message;
 }
}

function renderHistory(){
 let html="";
 chats.forEach((chat,index)=>{
  let btn=document.createElement("button");
  btn.style.width="100%";
  btn.style.margin="5px 0";
  btn.textContent=chat.title;
  btn.onclick=()=>openChat(index);
  document.getElementById("history").appendChild(btn);
 });
 let list=document.getElementById("allHistory");
 list.innerHTML="";
 chats.forEach((chat,index)=>{
  let btn=document.createElement("button");
  btn.style.margin="5px";
  btn.textContent=chat.title;
  btn.onclick=()=>openChat(index);
  list.appendChild(btn);
 });
}

function openChat(index){
 currentChat=chats[index].messages.slice();
 document.getElementById("chat").innerHTML="";
 currentChat.forEach(m=>addMessage(m.text,m.role==="user"?"user":""));
 showHome();
}

function clearHistory(){
 if(confirm("Delete all saved chat history?")){
  chats=[];
  save();
  renderHistory();
  newChat();
 }
}

function toggleTheme(){
 document.body.style.background=
 document.body.style.background==="#090d1b"?"#eeeeee":"#090d1b";
 document.body.style.color=
 document.body.style.color==="white"?"#111":"white";
}

if(user)startApp();
</script>
</body>
</html>

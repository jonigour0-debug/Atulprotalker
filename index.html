 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtulProTalker AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #0b1020; color: white;
    }
    .app {
      max-width: 750px; height: 100dvh; margin: auto;
      display: flex; flex-direction: column; padding: 16px;
    }
    header { padding: 14px 0; border-bottom: 1px solid #303952; }
    header h2 { margin: 0 0 7px; color: #71b7ff; }
    #chat {
      flex: 1; overflow-y: auto; padding: 12px 0;
    }
    .msg {
      padding: 12px 14px; border-radius: 14px;
      margin: 10px 0; white-space: pre-wrap;
      overflow-wrap: anywhere; line-height: 1.5;
    }
    .bot { background: #1b2740; }
    .user { background: #174f88; margin-left: 12%; }
    form { display: flex; gap: 8px; padding-top: 10px; }
    input {
      flex: 1; min-width: 0; padding: 14px;
      border-radius: 12px; border: 1px solid #46536b;
      background: #172033; color: white; font-size: 16px;
    }
    button {
      border: 0; border-radius: 12px; padding: 12px 16px;
      background: #2785f5; color: white; font-weight: bold;
    }
    button:disabled { opacity: .5; }
    small { color: #a9b8d0; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h2>⚡ AtulProTalker AI</h2>
    <small>Your smart AI assistant • Hindi + English</small>
  </header>

  <main id="chat" aria-live="polite">
    <div class="msg bot">
      Hello! Welcome to AtulProTalker AI.
      Ask me anything — Maths, Science, coding or general knowledge!
    </div>
  </main>

  <form id="form">
    <input id="question" placeholder="Ask anything..." required
           maxlength="4000" autocomplete="off">
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("question");
const send = document.getElementById("send");

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question || send.disabled) return;

  addMessage(question, "user");
  input.value = "";
  send.disabled = true;
  const waiting = addMessage("Thinking...", "bot");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: question })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    waiting.textContent = data.reply || "No answer received.";
  } catch (error) {
    waiting.textContent =
      "AI connection failed. Check your backend setup and try again.";
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
